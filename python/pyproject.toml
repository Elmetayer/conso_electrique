[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiwatt"
version = "0.1.0"
description = "Récupération et analyse de la courbe de charge Linky via conso.boris.sh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # bibliothèque standard uniquement

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
optiwatt = "optiwatt.cli:main"

[tool.setuptools]
packages = ["optiwatt"]
